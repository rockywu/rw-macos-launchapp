<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 148" width="800" height="148" role="img" aria-labelledby="title">
<title id="title">系统提示试用包「已损坏」时</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#143643"/></linearGradient></defs>
<rect width="800" height="148" rx="18" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, system-ui, PingFang SC, sans-serif">
<text x="28" y="37" font-size="22" fill="#f1f7ff" font-weight="650">系统提示试用包「已损坏」时</text>
<rect x="28" y="57" width="242" height="70" rx="10" fill="#0e1b2d" stroke="#45607c"/>
<circle cx="53" cy="81" r="12" fill="#194955"/>
<text x="53" y="86" font-size="14" fill="#76e4d2" text-anchor="middle" font-weight="650">1</text>
<text x="73" y="85" font-size="16" fill="#f1f7ff" font-weight="600">下载修复工具</text>
<text x="73" y="108" font-size="13" fill="#b5c7df" >选择相同发布版本。</text>
<rect x="279" y="57" width="242" height="70" rx="10" fill="#0e1b2d" stroke="#45607c"/>
<circle cx="304" cy="81" r="12" fill="#194955"/>
<text x="304" y="86" font-size="14" fill="#76e4d2" text-anchor="middle" font-weight="650">2</text>
<text x="324" y="85" font-size="16" fill="#f1f7ff" font-weight="600">选择 RWLaunch.app</text>
<text x="324" y="108" font-size="13" fill="#b5c7df" >先双击修复脚本。</text>
<rect x="530" y="57" width="242" height="70" rx="10" fill="#0e1b2d" stroke="#45607c"/>
<circle cx="555" cy="81" r="12" fill="#194955"/>
<text x="555" y="86" font-size="14" fill="#76e4d2" text-anchor="middle" font-weight="650">3</text>
<text x="575" y="85" font-size="16" fill="#f1f7ff" font-weight="600">回到访达打开应用</text>
<text x="575" y="108" font-size="13" fill="#b5c7df" >等待脚本提示成功。</text>
</g>
</svg>
