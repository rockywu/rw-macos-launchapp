<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="title">
<title id="title">Options menu</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#143643"/></linearGradient></defs>
<rect width="800" height="430" rx="18" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, system-ui, PingFang SC, sans-serif">
<text x="29" y="39" font-size="23" fill="#f1f7ff" font-weight="650">Options menu</text>
<text x="29" y="64" font-size="15" fill="#b5c7df" >Open it from the menu bar grid or the … beside Search Apps.</text>
<rect x="29" y="83" width="327" height="322" rx="14" fill="#0e1b2d" stroke="#45607c"/>
<rect x="40" y="94" width="305" height="32" rx="7" fill="#174457" stroke="none"/>
<text x="72" y="116" font-size="18" fill="#f1f7ff" >Open Launcher</text>
<text x="72" y="166" font-size="18" fill="#f1f7ff" >4- or 5-Finger Pinch</text>
<path d="M 50 161 l 4 4 l 6 -8" fill="none" stroke="#76e4d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="199" font-size="18" fill="#f1f7ff" >Open at Login</text>
<path d="M 50 194 l 4 4 l 6 -8" fill="none" stroke="#76e4d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="232" font-size="18" fill="#f1f7ff" >Reconnect Trackpad</text>
<text x="72" y="265" font-size="18" fill="#f1f7ff" >System Pinch: Active</text>
<text x="72" y="298" font-size="18" fill="#f1f7ff" >Show Menu Bar Icon</text>
<path d="M 50 293 l 4 4 l 6 -8" fill="none" stroke="#76e4d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="331" font-size="18" fill="#f1f7ff" >Language</text>
<text x="72" y="385" font-size="18" fill="#f1f7ff" >Quit</text>
<path d="M 49 138 H 337 M 49 350 H 337" fill="none" stroke="#45607c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 326 321 l 4 4 l -4 4" fill="none" stroke="#76e4d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="304" y="385" font-size="17" fill="#b5c7df" >⌘Q</text>
<path d="M 356 325 H 372 L 402 302 H 417" fill="none" stroke="#76e4d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="418" y="280" width="245" height="119" rx="13" fill="#0e1b2d" stroke="#45607c"/>
<rect x="428" y="290" width="225" height="32" rx="6" fill="#174457" stroke="none"/>
<path d="M 441 306 l 4 4 l 6 -8" fill="none" stroke="#76e4d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="465" y="312" font-size="18" fill="#f1f7ff" >System</text>
<text x="465" y="345" font-size="18" fill="#f1f7ff" >English</text>
<text x="465" y="378" font-size="18" fill="#f1f7ff" >简体中文</text>
<text x="419" y="255" font-size="16" fill="#b5c7df" >Choose your interface language</text>
</g>
</svg>
